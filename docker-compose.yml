# Servicios para desarrollo local. La API y la web corren fuera de Docker con hot reload.
name: hospital-chat

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hospital_chat
      POSTGRES_USER: hospital_chat
      POSTGRES_PASSWORD: hospital_chat
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # Solo corre la primera vez que se crea el volumen.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hospital_chat -d hospital_chat']
      interval: 5s
      timeout: 3s
      retries: 10

  # Cliente web de la base para explorar datos en local: http://localhost:8080
  # Opcional: docker compose --profile tools up -d adminer
  adminer:
    image: adminer:5
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '127.0.0.1:${ADMINER_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
